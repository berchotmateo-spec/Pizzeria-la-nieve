<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Los Naranjos — video de la propuesta</title>
<!--
  EL VIDEO DE LA PROPUESTA, cuadro por cuadro.

  Esta página no se reproduce: se dibuja. `window.render(t)` deja en pantalla
  el cuadro del segundo `t`, y armar-video.mjs la recorre de punta a punta
  sacándole una foto a cada cuadro. Por eso acá no hay transiciones de CSS ni
  nada que dependa del reloj: todo sale de `t`.

  Lo que se ve del sistema son capturas del sistema de verdad (capturar.mjs).
  Lo único escrito a mano son los títulos, los globos de chat de la primera
  escena y el marco del celular.

  Para cambiar un texto: buscalo más abajo, en LEYENDAS, PUNTOS o el cierre.
  Para cambiar cuándo pasa algo: en T, los tiempos, en segundos.
-->
<style>
@font-face {
  font-family: 'Archivo';
  src: url('.cache/fuentes/archivo.woff2') format('woff2');
  font-weight: 100 900;
}
:root {
  --negro: #0B0C0E;
  --negro-3: #1A1D22;
  --papel: #F7F4EF;
  --papel-2: #FFFFFF;
  --naranja: #FF6B14;
  --naranja-alto: #FF8C42;
  --claro: #F7F4EF;
  --claro-2: rgba(247, 244, 239, .68);
  --claro-3: rgba(247, 244, 239, .42);
  --linea-clara: rgba(247, 244, 239, .16);
  --tinta: #0B0C0E;
  --tinta-3: #7C828C;
  --exito: #12855F;
  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --texto: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; }
body { width: 1080px; height: 1920px; overflow: hidden; }

#lienzo {
  position: relative;
  width: 1080px; height: 1920px;
  overflow: hidden;
  background: var(--negro);
  color: var(--claro);
  font-family: var(--texto);
  -webkit-font-smoothing: antialiased;
}
#lienzo * { will-change: auto; }

/* ── Fondo ──────────────────────────────────────────────────────────────── */
#brillo {
  position: absolute; left: -520px; top: -620px;
  width: 1500px; height: 1500px;
  background: radial-gradient(50% 50% at 50% 50%, rgba(255,107,20,.26), transparent 70%);
}
#brillo-2 {
  position: absolute; right: -700px; bottom: -700px;
  width: 1500px; height: 1500px;
  background: radial-gradient(50% 50% at 50% 50%, rgba(14,107,79,.22), transparent 70%);
}
#cancha {
  position: absolute; left: 50%; top: 58%;
  width: 1900px;
  transform: translate(-50%, -50%) rotate(-8deg);
  color: rgba(247, 244, 239, .045);
}

/* ── Marca, arriba de todo el video ─────────────────────────────────────── */
#marca {
  position: absolute; left: 72px; right: 72px; top: 84px;
  display: flex; align-items: center; justify-content: space-between;
}
.marca__logo { display: flex; align-items: center; gap: 18px; }
.marca__logo svg { width: 56px; height: 56px; color: var(--naranja); }
.marca__nombre { font-family: var(--display); font-weight: 800; font-size: 31px; letter-spacing: .02em; }
.etiqueta-arriba {
  position: absolute; right: 0; top: 50%;
  font-size: 20px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  padding: 11px 20px;
  border: 1.5px solid var(--linea-clara); border-radius: 999px;
  color: var(--claro-2);
  white-space: nowrap;
}

/* ── Leyendas: el texto de cada momento ─────────────────────────────────── */
.leyenda { position: absolute; left: 72px; right: 72px; top: 204px; }
.leyenda__antes {
  font-size: 25px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--naranja-alto);
}
.leyenda__titulo {
  margin-top: 20px;
  font-family: var(--display); font-weight: 900;
  font-size: 84px; line-height: .98; letter-spacing: -.035em;
}
.leyenda__titulo em, .cierre__titulo em { font-style: normal; color: var(--naranja); }
.leyenda__bajada { margin-top: 24px; font-size: 36px; line-height: 1.3; color: var(--claro-2); }

/* ── Escena 1 · el problema ─────────────────────────────────────────────── */
#problema .renglon { display: block; overflow: hidden; padding-bottom: 10px; margin-bottom: -10px; }
#problema .renglon > span { display: block; }
#problema .leyenda__titulo { font-size: 112px; }
.globo {
  position: absolute; left: 72px;
  max-width: 820px;
  padding: 26px 34px 22px;
  background: var(--papel); color: var(--tinta);
  border-radius: 34px 34px 34px 10px;
  font-size: 40px; line-height: 1.25; font-weight: 500;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
  transform-origin: 0 100%;
}
.globo small { display: block; margin-top: 8px; font-size: 24px; font-weight: 500; color: var(--tinta-3); text-align: right; }
#pregunta {
  position: absolute; left: 72px; right: 72px; top: 1330px;
  font-family: var(--display); font-weight: 800;
  font-size: 68px; line-height: 1.04; letter-spacing: -.03em;
  color: var(--naranja-alto);
}

/* ── El celular ─────────────────────────────────────────────────────────── */
#zona-telefono { position: absolute; left: 0; top: 540px; width: 1080px; height: 1380px; overflow: hidden; }
#telefono {
  position: absolute; left: 0; top: 0;
  width: 414px; height: 848px;
  transform-origin: 0 0;
  background: #15171B;
  border-radius: 58px;
  box-shadow: 0 0 0 1.5px rgba(255,255,255,.14) inset, 0 40px 90px rgba(0,0,0,.6);
}
.tel__pantalla { position: absolute; inset: 12px; border-radius: 46px; overflow: hidden; background: #000; }
.tel__estado {
  position: absolute; left: 0; top: 0; width: 390px; height: 44px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 30px 0;
  background: var(--negro);
  font-size: 15px; font-weight: 600; color: #fff;
}
.tel__isla { position: absolute; left: 50%; top: 9px; width: 104px; height: 28px; margin-left: -52px; border-radius: 999px; background: #000; }
.tel__iconos { display: flex; align-items: center; gap: 6px; }
.tel__barras { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
.tel__barras i { width: 3px; background: #fff; border-radius: 1px; }
.tel__pila { width: 24px; height: 11.5px; border: 1.2px solid rgba(255,255,255,.55); border-radius: 3.5px; padding: 1.2px; }
.tel__pila i { display: block; width: 78%; height: 100%; background: #fff; border-radius: 1.5px; }
#pagina { position: absolute; left: 0; top: 44px; width: 390px; height: 780px; overflow: hidden; background: var(--papel); }
/* Las capturas de la página van en su propio plano, debajo de lo que queda fijo. */
#capas { position: absolute; inset: 0; z-index: 0; isolation: isolate; }
#pagina .capa { position: absolute; left: 0; top: 0; width: 390px; height: auto; display: block; transform-origin: 0 0; }
#cabecera-fija {
  position: absolute; left: 0; top: 0; width: 390px; z-index: 2;
  background: rgba(11, 12, 14, .96);
  border-bottom: 1px solid rgba(247, 244, 239, .08);
}
#cabecera-fija img { display: block; width: 390px; height: auto; }
#wsp-fijo { position: absolute; z-index: 3; display: block; filter: drop-shadow(0 10px 14px rgba(31,168,85,.38)); }
#toque {
  position: absolute; z-index: 5; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px;
  border-radius: 50%;
  background: rgba(15, 16, 18, .26);
  box-shadow: 0 0 0 3px rgba(255,255,255,.92), 0 0 0 4.5px rgba(0,0,0,.2);
  opacity: 0;
}
#toque-onda { position: absolute; z-index: 4; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); opacity: 0; }

/* ── Escena 4 · el panel del club ───────────────────────────────────────── */
.tarjeta {
  position: absolute;
  background: var(--papel);
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
  transform-origin: 50% 0;
}
.tarjeta img { position: absolute; left: 0; top: 0; display: block; max-width: none; transform-origin: 0 0; }
.ficha { position: absolute; overflow: hidden; background: #fff; box-shadow: 0 22px 60px rgba(0,0,0,.45); transform-origin: 50% 60%; }
.ficha img { position: absolute; display: block; max-width: none; }
#grilla-nombres { position: absolute; left: 0; top: 0; overflow: hidden; box-shadow: 10px 0 24px rgba(11,12,14,.12); }
#resalte {
  position: absolute; border: 5px solid var(--naranja); border-radius: 22px;
  box-shadow: 0 0 0 9999px rgba(247, 244, 239, .0);
}
#resalte-fila { position: absolute; left: 0; background: rgba(255, 107, 20, .13); border-left: 8px solid var(--naranja); }
.nota { position: absolute; left: 72px; right: 72px; font-family: var(--display); font-weight: 800; font-size: 108px; line-height: .98; letter-spacing: -.035em; }
.nota em { font-style: normal; color: var(--naranja); }

/* ── Escena 5 · por qué conviene ────────────────────────────────────────── */
.punto { position: absolute; left: 72px; right: 72px; display: flex; gap: 34px; align-items: flex-start; }
.punto__tilde {
  flex: none; width: 84px; height: 84px; margin-top: 4px;
  display: grid; place-items: center;
  border-radius: 50%; background: var(--naranja); color: var(--negro);
}
.punto__tilde svg { width: 40px; height: 40px; }
.punto__texto { font-family: var(--display); font-weight: 800; font-size: 66px; line-height: 1.06; letter-spacing: -.03em; }
.punto__texto small { display: block; margin-top: 12px; font-family: var(--texto); font-weight: 400; font-size: 32px; line-height: 1.3; letter-spacing: 0; color: var(--claro-2); }

/* ── Escena 6 · el cierre ───────────────────────────────────────────────── */
#cierre { position: absolute; inset: 0; text-align: center; }
#cierre-logo { position: absolute; left: 0; right: 0; top: 330px; display: grid; justify-items: center; gap: 30px; }
#cierre-logo svg { width: 190px; height: 190px; color: var(--naranja); }
#cierre-logo b { font-family: var(--display); font-weight: 900; font-size: 60px; letter-spacing: .03em; }
.cierre__titulo {
  position: absolute; left: 60px; right: 60px; top: 760px;
  font-family: var(--display); font-weight: 900; font-size: 116px; line-height: .96; letter-spacing: -.04em;
}
.cierre__bajada { position: absolute; left: 60px; right: 60px; top: 1060px; font-size: 44px; line-height: 1.3; color: var(--claro-2); }
.cierre__bajada b { display: block; color: var(--claro); font-weight: 600; }
#firma { position: absolute; left: 0; right: 0; top: 1500px; display: grid; justify-items: center; gap: 12px; }
#firma i { display: block; width: 90px; height: 3px; background: var(--naranja); margin-bottom: 26px; }
#firma b { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -.01em; }
#firma span { font-size: 29px; color: var(--claro-2); }
</style>
</head>
<body>
<div id="lienzo">
  <div id="brillo"></div>
  <div id="brillo-2"></div>
  <svg id="cancha" viewBox="0 0 200 100" fill="none" stroke="currentColor" stroke-width=".5" aria-hidden="true">
    <rect x=".5" y=".5" width="199" height="99"/><path d="M100 0v100"/><path d="M30 0v100M170 0v100"/><path d="M30 50h140"/>
  </svg>

  <div id="marca">
    <div class="marca__logo">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="2.2"/>
        <path d="M3 24h42" stroke="currentColor" stroke-width="2.2"/>
        <path d="M13 24V10.5M35 24v13.5" stroke="currentColor" stroke-width="1.4" opacity=".75"/>
      </svg>
      <span class="marca__nombre">LOS NARANJOS</span>
    </div>
    <span class="etiqueta-arriba" id="etiqueta-propuesta">Propuesta</span>
    <span class="etiqueta-arriba" id="etiqueta-demo">Demo · datos y montos de ejemplo</span>
  </div>

  <!-- 1 · El problema -->
  <div class="leyenda" id="problema">
    <p class="leyenda__antes">Hoy</p>
    <p class="leyenda__titulo">
      <span class="renglon"><span>Cada turno</span></span>
      <span class="renglon"><span>pasa por</span></span>
      <span class="renglon"><span>el WhatsApp.</span></span>
    </p>
  </div>
  <div id="globos"></div>
  <p id="pregunta">¿Cuántos se pierden<br>por no llegar a contestar?</p>

  <!-- Las leyendas de las demás escenas las arma el script -->
  <div id="leyendas"></div>

  <!-- 2 y 3 · El celular -->
  <div id="zona-telefono">
    <div id="telefono">
      <div class="tel__pantalla">
        <div id="pagina">
          <div id="capas"></div>
          <div id="cabecera-fija"><img id="img-cabecera" alt=""></div>
          <img id="wsp-fijo" alt="">
          <div id="toque-onda"></div>
          <div id="toque"></div>
        </div>
        <div class="tel__estado">
          <span>20:14</span>
          <span class="tel__iconos">
            <span class="tel__barras"><i style="height:4px"></i><i style="height:6.5px"></i><i style="height:9px"></i><i style="height:11px"></i></span>
            <span class="tel__pila"><i></i></span>
          </span>
        </div>
        <div class="tel__isla"></div>
      </div>
    </div>
  </div>

  <!-- 4 · El panel del club -->
  <div id="panel">
    <div id="fichas"></div>
    <div class="tarjeta" id="t-grilla"><img id="img-grilla" alt=""><div id="grilla-nombres"><img id="img-grilla-nombres" alt=""></div></div>
    <div class="tarjeta" id="t-turnos"><img id="img-turnos" alt=""><div id="resalte"></div></div>
    <div class="tarjeta" id="t-movimientos"><img id="img-movimientos" alt=""><div id="resalte-fila"></div></div>
    <div id="notas"></div>
  </div>

  <!-- 5 · Por qué conviene -->
  <div id="puntos"></div>

  <!-- 6 · El cierre -->
  <div id="cierre">
    <div id="cierre-logo">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="1.7"/>
        <path d="M3 24h42" stroke="currentColor" stroke-width="1.7"/>
        <path d="M13 24V10.5M35 24v13.5" stroke="currentColor" stroke-width="1.1" opacity=".75"/>
      </svg>
      <b>LOS NARANJOS</b>
    </div>
    <p class="cierre__titulo">Ya está armado<br>y <em>probado</em>.</p>
    <p class="cierre__bajada"><b>¿Lo vemos juntos?</b>Son diez minutos.</p>
    <div id="firma"><i></i><b>Mateo Berchot</b><span>Sitio web y sistema de turnos · Mar del Plata</span></div>
  </div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const CAPTURAS = '.cache/capturas/';
const D = await (await fetch(CAPTURAS + 'datos.json')).json();
const P = D.pantallas;
const medio = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

/* ═══════════════════════════════════════════════════════════════════════════
   LOS TEXTOS
   ═══════════════════════════════════════════════════════════════════════════ */
const GLOBOS = [
  { texto: 'Hola! ¿Tienen cancha hoy a las 20?', hora: '19:42', y: 790, entra: 1.55 },
  { texto: '¿Y mañana a las 21:30?', hora: '21:15', y: 962, entra: 2.15 },
  { texto: '¿Hola?', hora: '23:08', y: 1134, entra: 2.75 },
];

const LEYENDAS = [
  { de: 5.3, a: 8.45, antes: 'La propuesta', titulo: 'Que la cancha<br>se reserve <em>sola</em>.', bajada: 'A cualquier hora, desde el celular.' },
  { de: 8.7, a: 14.65, antes: 'El jugador', titulo: 'Elige el día<br>y el horario.', bajada: 'Ve en vivo qué canchas quedan libres.' },
  { de: 14.9, a: 20.35, antes: 'El jugador', titulo: 'Paga la seña<br>con Mercado Pago.', bajada: 'O el turno entero, si prefiere.' },
  { de: 20.6, a: 25.0, antes: 'El jugador', titulo: 'Y la cancha queda<br><em>confirmada</em>.', bajada: 'Al instante, sin que nadie del club haga nada.' },
  { de: 25.7, a: 31.3, antes: 'El club', titulo: 'Todo el día<br>en una pantalla.', bajada: 'Las siete canchas, hora por hora.' },
  { de: 31.7, a: 36.3, antes: 'El club', titulo: 'Quién reservó<br>y quién ya pagó.', bajada: 'La seña cobrada, al lado de cada turno.' },
  { de: 36.7, a: 42.3, antes: 'El club', titulo: 'Cada uno entra<br>con su usuario.', bajada: 'Y queda anotado quién hizo cada cosa.' },
  { de: 42.6, a: 51.9, antes: 'Por qué conviene' },
];

const PUNTOS = [
  { entra: 43.0, y: 330, texto: 'Dos personas nunca<br>se quedan con la<br>misma cancha.' },
  { entra: 45.2, y: 700, texto: 'La seña entra directo<br>al Mercado Pago<br>del club.' },
  { entra: 47.4, y: 1070, texto: 'Los turnos por WhatsApp<br>los sigue cargando<br>el mostrador.' },
  { entra: 49.6, y: 1440, texto: 'El sistema no cobra<br>comisión por turno.' },
];

/* ═══════════════════════════════════════════════════════════════════════════
   LOS TIEMPOS, en segundos
   ═══════════════════════════════════════════════════════════════════════════ */
/* Los tres renglones del registro que se resaltan: cuál, desde cuándo y qué dice en grande. */
const NOTAS = [
  { fila: 0, desde: 37.4, texto: '<em>Vale</em> canceló<br>un turno.' },
  { fila: 1, desde: 39.1, texto: '<em>Vale</em> anotó<br>a un cliente.' },
  { fila: 3, desde: 40.7, texto: '<em>Nico</em> bloqueó<br>la Central.' },
];
const DURACION = 59;
const T = {
  problemaSale: 4.75,
  telEntra: 5.9,
  toqueReservar: 8.0, aReservar: 8.3,
  toqueDia: 10.3, aHorarios: 10.5,
  toqueHora: 13.2, aHoraElegida: 13.4,
  aDatos: 15.45,
  toqueSeña: 17.5, aSeñaElegida: 17.7,
  toqueBoton: 20.2, aTurno: 20.5,
  telSale: 24.9,
  panelEntra: 25.7, aTurnos: 31.4, aMovimientos: 36.4, panelSale: 42.3,
  puntosSalen: 51.9,
  cierre: 52.3,
};

/* ── Herramientas de animación ────────────────────────────────────────────── */
const limitar = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  recta: (x) => x,
  sale: (x) => 1 - Math.pow(1 - x, 3),
  entra: (x) => x * x * x,
  suave: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  rebote: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
/** Cuánto avanzó (0 a 1) algo que empieza en `desde` y dura `dura`. */
const avance = (t, desde, dura, curva = E.sale) => curva(limitar((t - desde) / dura));
/** Un valor que pasa por puntos [tiempo, valor, curva]. Entre dos iguales, se queda quieto. */
function pista(t, puntos) {
  if (t <= puntos[0][0]) return puntos[0][1];
  for (let i = 1; i < puntos.length; i++) {
    const [t1, v1, curva = E.suave] = puntos[i];
    const [t0, v0] = puntos[i - 1];
    if (t <= t1) return v0 + (v1 - v0) * curva((t - t0) / (t1 - t0));
  }
  return puntos.at(-1)[1];
}
/** Aparece subiendo y se va subiendo un poco más. */
function mostrar(el, t, de, a, { sube = 44, dura = 0.5 } = {}) {
  const entra = avance(t, de, dura);
  const sale = a == null ? 0 : avance(t, a, 0.32, E.entra);
  const o = entra * (1 - sale);
  el.style.opacity = o.toFixed(4);
  el.style.transform = `translateY(${((1 - entra) * sube - sale * 26).toFixed(2)}px)`;
  el.style.visibility = o < 0.002 ? 'hidden' : 'visible';
  return o;
}

/* ═══════════════════════════════════════════════════════════════════════════
   ARMADO
   ═══════════════════════════════════════════════════════════════════════════ */
const imagenes = [];
function imagen(el, archivo) { el.src = CAPTURAS + archivo; imagenes.push(el); return el; }

// Globos de la primera escena.
$('#globos').innerHTML = GLOBOS.map((g) =>
  `<div class="globo" style="top:${g.y}px">${g.texto}<small>${g.hora}</small></div>`).join('');
const globos = [...document.querySelectorAll('.globo')];

// Leyendas.
$('#leyendas').innerHTML = LEYENDAS.map((l) => `
  <div class="leyenda">
    <p class="leyenda__antes">${l.antes}</p>
    ${l.titulo ? `<p class="leyenda__titulo">${l.titulo}</p>` : ''}
    ${l.bajada ? `<p class="leyenda__bajada">${l.bajada}</p>` : ''}
  </div>`).join('');
const leyendas = [...document.querySelectorAll('#leyendas .leyenda')];

// Puntos.
$('#puntos').innerHTML = PUNTOS.map((p) => `
  <div class="punto" style="top:${p.y}px">
    <span class="punto__tilde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <p class="punto__texto">${p.texto}</p>
  </div>`).join('');
const puntos = [...document.querySelectorAll('.punto')];

/* ── El celular ───────────────────────────────────────────────────────────── */
const VENTANA = D.celular.alto;                       // alto de la página visible, en px del sitio
const ESTADOS = [
  { nombre: 'portada', desde: 0 },
  { nombre: 'reservar-1', desde: T.aReservar, cambio: 'pagina' },
  { nombre: 'reservar-2', desde: T.aHorarios },
  { nombre: 'reservar-3', desde: T.aHoraElegida },
  { nombre: 'reservar-4', desde: T.aDatos, cambio: 'funde' },
  { nombre: 'reservar-5', desde: T.aSeñaElegida },
  { nombre: 'turno', desde: T.aTurno, cambio: 'pagina' },
];
const DURA_CAMBIO = { pagina: 0.32, funde: 0.4, undefined: 0.1 };
for (const e of ESTADOS) {
  e.img = imagen(document.createElement('img'), P[e.nombre].archivo);
  e.img.className = 'capa';
  e.tope = Math.max(0, P[e.nombre].alto - VENTANA);
  $('#capas').appendChild(e.img);
}
imagen($('#img-cabecera'), 'cel-cabecera.png');
const wsp = imagen($('#wsp-fijo'), 'cel-wsp.png');
wsp.style.left = `${D.wsp.x - D.wsp.margen}px`;
wsp.style.top = `${D.wsp.y - D.wsp.margen}px`;
wsp.style.width = `${D.wsp.w + D.wsp.margen * 2}px`;

// Hasta dónde baja la página en cada momento (px del sitio).
const bajaDia = P['reservar-1'].marcas.bloqueDia.y - 245;
const bajaHora = medio(P['reservar-2'].marcas.hora).y - 420;
const bajaPago = P['reservar-4'].marcas.bloquePago.y - 108;
const bajaFin = P['reservar-5'].alto - VENTANA;
const bajaTurno0 = P.turno.marcas.tilde.y - 104;
const bajaTurno1 = P.turno.marcas.ticket.y - 232;
const bajadaReservar = (t) => pista(t, [
  [8.9, 0], [9.9, bajaDia], [10.8, bajaDia], [12.0, bajaHora],
  [14.9, bajaHora], [16.3, bajaPago], [19.0, bajaPago], [19.9, bajaFin],
]);
const bajadaTurno = (t) => pista(t, [[21.7, bajaTurno0], [22.6, bajaTurno1]]);
const bajadaDe = (e, t) => limitar(e.nombre === 'portada' ? 0 : e.nombre === 'turno' ? bajadaTurno(t) : bajadaReservar(t), 0, e.tope);

// Dónde toca el dedo: [cuándo, x, y] con x e y en px de la página entera.
const TOQUES = [
  [T.toqueReservar, medio(P.portada.marcas.reservar)],
  [T.toqueDia, medio(P['reservar-1'].marcas.dia)],
  [T.toqueHora, medio(P['reservar-2'].marcas.hora)],
  [T.toqueSeña, { x: 195, y: P['reservar-4'].marcas.seña.y + 78 }],
  [T.toqueBoton, medio(P['reservar-5'].marcas.boton)],
];

/* La cámara: qué tan grande se ve el celular y dónde queda su esquina de arriba
   a la izquierda dentro de la zona. `acercar` arma un primer plano que deja un
   punto de la pantalla (px del sitio) en un lugar de la zona. */
const CAM = { s: 1.66, x: 540 - 207 * 1.66, y: 26 };
const acercar = (px, py, s, zy) => ({ s, x: 540 - (12 + px) * s, y: zy - (56 + py) * s });
const camHora = acercar(195, medio(P['reservar-2'].marcas.hora).y - bajaHora - 30, 2.12, 600);
const camPago = acercar(195, P['reservar-4'].marcas.seña.y - bajaPago + 165, 2.0, 640);
const camTurno = acercar(195, P.turno.marcas.ticket.y - bajaTurno1 + 215, 1.92, 660);
const camara = (t) => {
  const tramo = [
    [T.telEntra, { ...CAM, y: 1500 }], [T.telEntra + 0.95, CAM, E.sale],
    [12.0, CAM], [12.7, camHora], [14.1, camHora], [14.9, CAM],
    [16.4, CAM], [17.0, camPago], [18.5, camPago], [19.1, CAM],
    [22.6, CAM], [23.3, camTurno], [T.telSale, camTurno], [T.telSale + 0.6, { ...camTurno, y: 1500 }, E.entra],
  ];
  const de = (clave) => pista(t, tramo.map(([tt, c, curva]) => [tt, c[clave], curva]));
  return { s: de('s'), x: de('x'), y: de('y') };
};

/* ── El panel ─────────────────────────────────────────────────────────────── */
const R = D.panel.resumen, G = D.panel.grilla, TU = D.panel.turnos, M = D.panel.movimientos;

// Resumen del día: las cuatro primeras tarjetas, recortadas de la captura.
const K_FICHA = 2.3;
const X_FICHAS = (1080 - R.ancho * K_FICHA) / 2;
const Y_FICHAS = 590;
$('#fichas').innerHTML = R.tarjetas.slice(0, 4).map((f) => `
  <div class="ficha" style="left:${X_FICHAS + f.x * K_FICHA}px;top:${Y_FICHAS + f.y * K_FICHA}px;width:${f.w * K_FICHA}px;height:${f.h * K_FICHA}px;border-radius:${R.radio * K_FICHA}px">
    <img alt="" style="left:${-f.x * K_FICHA}px;top:${-f.y * K_FICHA}px;width:${R.ancho * K_FICHA}px">
  </div>`).join('');
const fichas = [...document.querySelectorAll('.ficha')];
fichas.forEach((f) => imagen(f.querySelector('img'), R.archivo));
const FIN_FICHAS = Y_FICHAS + Math.max(...R.tarjetas.slice(0, 4).map((f) => f.y + f.h)) * K_FICHA;

// La grilla: primero el día entero, después de cerca, hacia la noche.
const ANCHO_TARJETA = 936, X_TARJETA = 72;
const Y_GRILLA = FIN_FICHAS + 56;
const S_GRILLA_TODO = ANCHO_TARJETA / G.ancho, S_GRILLA_CERCA = 2.0;
const hora = (h) => G.horas.find((x) => x.hora === h).x;
const X_NOCHE_0 = hora('18:00') - G.columnaCanchas - 6;
const X_NOCHE_1 = G.ancho - ANCHO_TARJETA / S_GRILLA_CERCA;
imagen($('#img-grilla'), G.archivo); imagen($('#img-grilla-nombres'), G.archivo);
for (const id of ['#img-grilla', '#img-grilla-nombres']) $(id).style.width = `${G.ancho}px`;

// Los turnos del día: de la hora y el nombre, hacia el pago.
const S_TURNOS = 1.72;
const Y_TURNOS = 590, ALTO_TURNOS = 1190;
const col = (titulo) => TU.columnas.find((c) => c.titulo === titulo);
const X_PAGO = col('A nombre de').x - 12;
imagen($('#img-turnos'), TU.archivo).style.width = `${TU.ancho}px`;

// Los movimientos.
const S_MOV = ANCHO_TARJETA / M.ancho;
const Y_MOV = 610;
const FILAS_MOV = 5;
const ALTO_MOV = (M.filas[FILAS_MOV].y) * S_MOV;
imagen($('#img-movimientos'), M.archivo).style.width = `${M.ancho}px`;
$('#notas').innerHTML = NOTAS.map((n) => `<p class="nota" style="top:${Math.round(Y_MOV + ALTO_MOV + 96)}px">${n.texto}</p>`).join('');
const notas = [...document.querySelectorAll('.nota')];

/* ═══════════════════════════════════════════════════════════════════════════
   EL CUADRO DEL SEGUNDO t
   ═══════════════════════════════════════════════════════════════════════════ */
function render(t) {
  /* Fondo: se mueve apenas, para que nada quede congelado. */
  $('#brillo').style.transform = `translate(${(Math.sin(t / 7) * 60).toFixed(2)}px, ${(Math.cos(t / 9) * 50).toFixed(2)}px)`;
  $('#brillo-2').style.transform = `translate(${(Math.cos(t / 8) * 50).toFixed(2)}px, ${(Math.sin(t / 6) * 40).toFixed(2)}px)`;
  $('#cancha').style.transform = `translate(-50%, -50%) rotate(${(-8 + Math.sin(t / 11) * 1.2).toFixed(3)}deg)`;

  /* Marca. */
  const marcaSale = avance(t, T.cierre - 0.4, 0.4, E.entra);
  $('#marca').style.opacity = (avance(t, 0.1, 0.6) * (1 - marcaSale)).toFixed(4);
  const demo = avance(t, T.aReservar, 0.4) * (1 - avance(t, T.panelSale, 0.35, E.entra));
  $('#etiqueta-demo').style.opacity = demo.toFixed(4);
  $('#etiqueta-demo').style.transform = `translateY(-50%) translateX(${((1 - demo) * 20).toFixed(2)}px)`;
  $('#etiqueta-propuesta').style.opacity = (1 - demo).toFixed(4);
  $('#etiqueta-propuesta').style.transform = 'translateY(-50%)';

  /* 1 · El problema. */
  {
    const sale = avance(t, T.problemaSale, 0.4, E.entra);
    const bloque = $('#problema');
    bloque.style.opacity = (1 - sale).toFixed(4);
    bloque.style.transform = `translateY(${(-sale * 40).toFixed(2)}px)`;
    bloque.style.visibility = sale >= 1 ? 'hidden' : 'visible';
    $('#problema .leyenda__antes').style.opacity = avance(t, 0.25, 0.5).toFixed(4);
    document.querySelectorAll('#problema .renglon > span').forEach((r, i) => {
      r.style.transform = `translateY(${((1 - avance(t, 0.4 + i * 0.16, 0.6)) * 110).toFixed(2)}%)`;
    });
    globos.forEach((g, i) => {
      const entra = avance(t, GLOBOS[i].entra, 0.42, E.rebote);
      const o = limitar(avance(t, GLOBOS[i].entra, 0.2, E.recta)) * (1 - sale);
      g.style.opacity = o.toFixed(4);
      g.style.transform = `translateY(${(-sale * 40).toFixed(2)}px) scale(${(0.72 + 0.28 * entra).toFixed(4)})`;
      g.style.visibility = o < 0.002 ? 'hidden' : 'visible';
    });
    mostrar($('#pregunta'), t, 3.35, T.problemaSale, { sube: 36 });
  }

  /* Leyendas. */
  leyendas.forEach((el, i) => mostrar(el, t, LEYENDAS[i].de, LEYENDAS[i].a));

  /* 2 y 3 · El celular. */
  {
    const zona = $('#zona-telefono');
    const visible = t >= T.telEntra && t <= T.telSale + 0.65;
    // Con display y no con visibility: las capas de adentro fijan la suya y se seguirían viendo.
    zona.style.display = visible ? 'block' : 'none';
    if (visible) {
      const c = camara(t);
      $('#telefono').style.transform = `translate(${c.x.toFixed(2)}px, ${c.y.toFixed(2)}px) scale(${c.s.toFixed(4)})`;

      let actual = 0;
      ESTADOS.forEach((e, i) => { if (t >= e.desde) actual = i; });
      ESTADOS.forEach((e, i) => {
        const dura = DURA_CAMBIO[e.cambio];
        const entra = i === 0 ? 1 : avance(t, e.desde, dura, E.sale);
        // Queda a la vista la pantalla actual y, mientras termina de entrar, la anterior por debajo.
        const seVe = i === actual || (i === actual - 1 && avance(t, ESTADOS[actual].desde, DURA_CAMBIO[ESTADOS[actual].cambio], E.recta) < 1);
        e.img.style.visibility = seVe ? 'visible' : 'hidden';
        e.img.style.opacity = (i === actual ? entra : 1).toFixed(4);
        const corre = e.cambio === 'pagina' && i === actual ? (1 - entra) * 26 : 0;
        e.img.style.transform = `translateY(${(corre - bajadaDe(e, t)).toFixed(2)}px)`;
        e.img.style.zIndex = i;
      });

      // El dedo.
      const dedo = $('#toque'), onda = $('#toque-onda');
      let o = 0, escala = 1, oOnda = 0, eOnda = 1, x = 0, y = 0;
      for (const [cuando, punto] of TOQUES) {
        if (t < cuando - 0.34 || t > cuando + 0.5) continue;
        const estado = ESTADOS.filter((e) => cuando >= e.desde).at(-1);
        x = punto.x; y = punto.y - bajadaDe(estado, cuando);
        const llega = avance(t, cuando - 0.34, 0.26);
        const aprieta = avance(t, cuando - 0.04, 0.12, E.suave);
        const suelta = avance(t, cuando + 0.1, 0.3, E.entra);
        o = llega * (1 - suelta);
        escala = (1.5 - 0.5 * llega) * (1 - 0.22 * aprieta);
        oOnda = t >= cuando ? (1 - avance(t, cuando, 0.5, E.sale)) * 0.9 : 0;
        eOnda = 1 + avance(t, cuando, 0.5, E.sale) * 1.5;
      }
      dedo.style.opacity = o.toFixed(4);
      dedo.style.transform = `translate(${x}px, ${y.toFixed(2)}px) scale(${escala.toFixed(4)})`;
      onda.style.opacity = oOnda.toFixed(4);
      onda.style.transform = `translate(${x}px, ${y.toFixed(2)}px) scale(${eOnda.toFixed(4)})`;
    }
  }

  /* 4 · El panel del club. */
  {
    // a) Resumen y grilla.
    const saleA = avance(t, T.aTurnos - 0.1, 0.35, E.entra);
    fichas.forEach((f, i) => {
      const entra = avance(t, T.panelEntra + 0.25 + i * 0.12, 0.5, E.rebote);
      const o = limitar(avance(t, T.panelEntra + 0.25 + i * 0.12, 0.25, E.recta)) * (1 - saleA);
      f.style.opacity = o.toFixed(4);
      f.style.transform = `translateY(${(-saleA * 30).toFixed(2)}px) scale(${(0.8 + 0.2 * entra).toFixed(4)})`;
      f.style.visibility = o < 0.002 ? 'hidden' : 'visible';
    });

    const g = $('#t-grilla');
    const oG = avance(t, T.panelEntra + 0.85, 0.5) * (1 - saleA);
    const s = pista(t, [[27.6, S_GRILLA_TODO], [28.9, S_GRILLA_CERCA]]);
    const corre = pista(t, [[27.6, 0], [28.9, X_NOCHE_0], [31.3, X_NOCHE_1, E.recta]]);
    g.style.visibility = oG < 0.002 ? 'hidden' : 'visible';
    g.style.opacity = oG.toFixed(4);
    g.style.left = `${X_TARJETA}px`; g.style.width = `${ANCHO_TARJETA}px`;
    g.style.top = `${Y_GRILLA}px`; g.style.height = `${(G.alto * s).toFixed(2)}px`;
    g.style.borderRadius = `${Math.min(30, 12 + s * 9).toFixed(1)}px`;
    g.style.transform = `translateY(${((1 - avance(t, T.panelEntra + 0.85, 0.5)) * 50 - saleA * 30).toFixed(2)}px)`;
    $('#img-grilla').style.transform = `translateX(${(-corre * s).toFixed(2)}px) scale(${s.toFixed(5)})`;
    // La columna con el nombre de cada cancha se queda quieta, como en el panel.
    const nombres = $('#grilla-nombres');
    nombres.style.width = `${(G.columnaCanchas * s).toFixed(2)}px`;
    nombres.style.height = `${(G.alto * s).toFixed(2)}px`;
    nombres.style.opacity = limitar(corre / 30).toFixed(4);
    $('#img-grilla-nombres').style.transform = `scale(${s.toFixed(5)})`;

    // b) Los turnos, con el pago.
    const tu = $('#t-turnos');
    const entraB = avance(t, T.aTurnos + 0.3, 0.55);
    const saleB = avance(t, T.aMovimientos - 0.1, 0.35, E.entra);
    const oB = entraB * (1 - saleB);
    tu.style.visibility = oB < 0.002 ? 'hidden' : 'visible';
    tu.style.opacity = oB.toFixed(4);
    tu.style.left = `${X_TARJETA}px`; tu.style.width = `${ANCHO_TARJETA}px`;
    tu.style.top = `${Y_TURNOS}px`; tu.style.height = `${ALTO_TURNOS}px`;
    tu.style.transform = `translateY(${((1 - entraB) * 60 - saleB * 30).toFixed(2)}px)`;
    const correB = pista(t, [[33.0, 0], [34.5, X_PAGO]]);
    $('#img-turnos').style.transform = `translate(${(-correB * S_TURNOS).toFixed(2)}px, 0) scale(${S_TURNOS})`;
    const pago = col('Pago');
    const marco = $('#resalte');
    const oMarco = avance(t, 34.7, 0.4) * (1 - avance(t, T.aMovimientos - 0.3, 0.2, E.entra));
    marco.style.opacity = oMarco.toFixed(4);
    marco.style.left = `${((pago.x - correB - 4) * S_TURNOS).toFixed(2)}px`;
    marco.style.width = `${((pago.w - 6) * S_TURNOS).toFixed(2)}px`;
    marco.style.top = `${(TU.filas[0].y * S_TURNOS + 6).toFixed(2)}px`;
    marco.style.height = `${(ALTO_TURNOS - TU.filas[0].y * S_TURNOS - 22).toFixed(2)}px`;
    marco.style.transform = `scale(${(1.04 - 0.04 * avance(t, 34.7, 0.4)).toFixed(4)})`;

    // c) El registro de movimientos.
    const m = $('#t-movimientos');
    const entraC = avance(t, T.aMovimientos + 0.3, 0.55);
    const saleC = avance(t, T.panelSale, 0.35, E.entra);
    const oC = entraC * (1 - saleC);
    m.style.visibility = oC < 0.002 ? 'hidden' : 'visible';
    m.style.opacity = oC.toFixed(4);
    m.style.left = `${X_TARJETA}px`; m.style.width = `${ANCHO_TARJETA}px`;
    m.style.top = `${Y_MOV}px`; m.style.height = `${ALTO_MOV.toFixed(2)}px`;
    m.style.transform = `translateY(${((1 - entraC) * 60 - saleC * 30).toFixed(2)}px)`;
    $('#img-movimientos').style.transform = `scale(${S_MOV.toFixed(5)})`;
    // Una por una, las tres cosas que pasaron: quién canceló, quién cargó un turno, quién bloqueó.
    const fila = $('#resalte-fila');
    const nota = NOTAS.filter((n) => t >= n.desde).at(-1) || NOTAS[0];
    fila.style.opacity = (avance(t, nota.desde, 0.3) * (1 - saleC)).toFixed(4);
    fila.style.top = `${(M.filas[nota.fila].y * S_MOV).toFixed(2)}px`;
    fila.style.height = `${(M.filas[nota.fila].h * S_MOV).toFixed(2)}px`;
    fila.style.width = `${ANCHO_TARJETA}px`;
    notas.forEach((el, i) => mostrar(el, t, NOTAS[i].desde + 0.05, NOTAS[i + 1] ? NOTAS[i + 1].desde - 0.22 : T.panelSale, { sube: 34, dura: 0.4 }));
  }

  /* 5 · Por qué conviene. */
  puntos.forEach((el, i) => {
    const entra = avance(t, PUNTOS[i].entra, 0.5);
    const sale = avance(t, T.puntosSalen, 0.32, E.entra);
    // Cuando llega el siguiente, los anteriores se apagan un poco; al final se prenden todos.
    const siguiente = PUNTOS[i + 1] ? avance(t, PUNTOS[i + 1].entra, 0.4, E.suave) : 0;
    const todos = avance(t, T.puntosSalen - 1.0, 0.4, E.suave);
    const brillo = 1 - 0.5 * siguiente * (1 - todos);
    const o = entra * (1 - sale) * brillo;
    el.style.opacity = o.toFixed(4);
    el.style.transform = `translateY(${((1 - entra) * 50 - sale * 26).toFixed(2)}px)`;
    el.style.visibility = o < 0.002 ? 'hidden' : 'visible';
    el.querySelector('.punto__tilde').style.transform = `scale(${(0.4 + 0.6 * avance(t, PUNTOS[i].entra + 0.05, 0.5, E.rebote)).toFixed(4)})`;
  });

  /* 6 · El cierre. */
  {
    const c = $('#cierre');
    c.style.visibility = t < T.cierre ? 'hidden' : 'visible';
    const logo = $('#cierre-logo');
    const eLogo = avance(t, T.cierre, 0.7, E.rebote);
    logo.style.opacity = avance(t, T.cierre, 0.4, E.recta).toFixed(4);
    logo.style.transform = `scale(${(0.7 + 0.3 * eLogo).toFixed(4)})`;
    mostrar($('.cierre__titulo'), t, T.cierre + 0.7, null, { sube: 50 });
    mostrar($('.cierre__bajada'), t, T.cierre + 1.9, null, { sube: 36 });
    mostrar($('#firma'), t, T.cierre + 3.0, null, { sube: 30 });
  }
}

/* Antes del primer cuadro: tipografías cargadas y capturas ya decodificadas. */
await Promise.all([
  document.fonts.load('900 80px Archivo'), document.fonts.load('800 40px Archivo'),
  document.fonts.load('400 30px Inter'), document.fonts.load('600 30px Inter'),
]);
await document.fonts.ready;
await Promise.all(imagenes.map((i) => i.decode()));

window.DURACION = DURACION;
window.render = render;
render(Number(new URLSearchParams(location.search).get('t')) || 0);
window.listo = true;
</script>
</body>
</html>
