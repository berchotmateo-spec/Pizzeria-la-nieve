<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Los Naranjos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0C0E">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/site.css">
<style>
  .perdido {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    background: var(--negro);
    color: var(--claro);
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }
  .perdido__cancha { position: absolute; inset: 50% auto auto 50%; width: 130%; transform: translate(-50%,-50%) rotate(-6deg); color: rgba(247,244,239,.07); }
  .perdido__contenido { position: relative; display: grid; gap: 1.4rem; justify-items: center; max-width: 46ch; }
  .perdido__numero { font-family: var(--display); font-size: clamp(5rem, 22vw, 11rem); font-weight: 900; line-height: .85; letter-spacing: -.06em; color: var(--naranja); }
</style>
</head>
<body>
<main class="perdido">
  <svg class="perdido__cancha" viewBox="0 0 200 100" fill="none" stroke="currentColor" stroke-width=".7" aria-hidden="true">
    <rect x=".5" y=".5" width="199" height="99"/><path d="M100 0v100"/><path d="M70 0v100M130 0v100"/><path d="M70 50h60"/>
  </svg>
  <div class="perdido__contenido">
    <p class="perdido__numero numeros">404</p>
    <h1 class="display-md">Esta pelota se fue afuera</h1>
    <p style="color:var(--claro-2)">
      La página que buscabas no existe o cambió de lugar.
      Volvé al inicio o fijate qué canchas quedan libres hoy.
    </p>
    <div style="display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center">
      <a class="boton" href="/">Ir al inicio</a>
      <a class="boton boton--contorno-claro" href="/reservar">Reservar un turno</a>
    </div>
  </div>
</main>
</body>
</html>
